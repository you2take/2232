<body>

  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <div class="grain" aria-hidden="true"></div>

  <header class="header">
    <a href="/" class="header__logo" aria-label="2232.inc">
      <img src="assets/logo-white.svg" alt="2232.inc" class="header__logo-img" />
    </a>
    <button class="header__burger" aria-label="Menu" type="button">
      <span></span><span></span>
    </button>
    <nav class="header__nav" aria-label="Global">
      <a href="about.html">About</a>
      <a href="/gallery/">Gallery</a>
      <a href="contact.html" class="is-active">Contact</a>
    </nav>
  </header>

  <main>
    <section class="container contact-lead">
      <h1 class="contact-lead__title">Let&rsquo;s create <em>something memorable.</em></h1>
      <p class="contact-lead__sub">Drop us a line below.</p>
      <p class="contact-lead__jp" lang="ja">お仕事のご相談・お問い合わせはこちらから。</p>
    </section>

    <section class="container">
      <form class="contact-form" action="https://script.google.com/macros/s/AKfycbzWrMKe4REWJ3ganhAuC3CxkIe7CFTH4nauVOHtzu-6IZ26Doih1Auz9Acbkl5PnKcmhQ/exec" method="post" novalidate data-contact-form>
        <div class="contact-form__row">
          <input class="contact-form__input" type="text" name="name" placeholder="Name / お名前" aria-label="お名前" autocomplete="name" maxlength="100" required />
        </div>
        <div class="contact-form__row">
          <input class="contact-form__input" type="text" name="company" placeholder="Company / 会社名（任意）" aria-label="会社名（任意）" autocomplete="organization" maxlength="150" />
        </div>
        <div class="contact-form__row">
          <input class="contact-form__input" type="email" name="email" placeholder="Email / メールアドレス" aria-label="メールアドレス" autocomplete="email" maxlength="200" required />
        </div>
        <div class="contact-form__row">
          <textarea class="contact-form__textarea" name="message" placeholder="Message / お問い合わせ内容" aria-label="お問い合わせ内容" maxlength="5000" required></textarea>
        </div>
        <div class="contact-form__trap" aria-hidden="true">
          <label>Website <input type="text" name="website" tabindex="-1" autocomplete="off" /></label>
        </div>
        <input type="hidden" name="page" value="https://2232.co.jp/contact.html" />
        <input type="hidden" name="elapsed" value="" />
        <p class="contact-form__note" lang="ja">送信内容は、お問い合わせへのご返信にのみ使用します。</p>
        <button class="contact-form__submit" type="submit">Send</button>
        <p class="contact-form__status" role="status" aria-live="polite" lang="ja"></p>
      </form>
    </section>

    <section class="container contact-direct reveal">
      <p class="contact-direct__label">Or email us directly</p>
      <a class="contact-direct__email" href="mailto:hello@2232.co.jp">hello@2232.co.jp</a>
    </section>
  </main>

  <footer class="footer">
    <p class="footer__brand">
      <img src="assets/logo-fv.svg" alt="2232.inc" class="footer__brand-img" />
    </p>
    <div class="footer__sns">
      <a href="/gallery/">Gallery</a>
      <a href="/contact.html">Contact</a>
